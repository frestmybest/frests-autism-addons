name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this addon
        uses: actions/checkout@v4
        with:
          path: addon

      # The addon compiles against the AUTISM Client API, which is not on any
      # public Maven repo. CI has to build and publish it locally first, exactly
      # like you do on your own machine.
      - name: Check out AUTISM Client
        uses: actions/checkout@v4
        with:
          repository: AutismDevelopment/Autism-Client
          path: client

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish client API to local Maven
        working-directory: client
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Build addon
        working-directory: addon
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: frest-autism-addons
          path: addon/build/libs/*.jar
          if-no-files-found: error
